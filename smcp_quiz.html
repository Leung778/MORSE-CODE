</div>

  {"number":144,"term":"VHF","meaning":"Very High Frequency (30-300 MHz)","page":25},
  {"number":145,"term":"Walk out (to) (of anchors)","meaning":"To reverse the action of a windlass so as to ease the cable","page":25},
  {"number":146,"term":"Way point","meaning":"A position a vessel has to pass or at which she has to alter course\naccording to her voyage plan","page":25},
  {"number":147,"term":"Windward","meaning":"The general direction from which the wind blows; opposite of leeward","page":25},
  {"number":148,"term":"Wreck","meaning":"A vessel which has been destroyed or sunk or abandoned at sea","page":25},
  {"number":149,"term":"Fairway","meaning":"Navigable part of a waterway","page":25},

  {"number":151,"term":"ITZ","meaning":"Inshore Traffic Zone (of a TSS): A routing measure comprising a\ndesignated area between the landward boundary of a TSS and the adjacent\ncoast","page":25},

];

document.getElementById('term-count').textContent = rawData.length;

let currentEntry = null;
const stopWords = new Set([
  'a','about','an','and','are','as','at','be','by','for','from','in','into',
  'is','it','of','on','or','that','the','their','to','was','when','which','with','etc','here'
]);

function extractKeywords(text) {
  return text.toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(word => word.length > 2 && !stopWords.has(word));
}

function getRandomEntry() {
  const idx = Math.floor(Math.random() * rawData.length);
  return rawData[idx];
}

function getDistractors(correctItem, key, count = 3) {
  const distractors = [];
  while (distractors.length < count) {
    const candidate = getRandomEntry();
    if (candidate.number !== correctItem.number && !distractors.some(d => d.number === candidate.number)) {
      distractors.push(candidate);
    }
  }
  return distractors;
}

function loadQuestion() {
  currentEntry = getRandomEntry();
  const mode = document.getElementById('modeSelect').value;
  const type = document.getElementById('typeSelect').value;

  document.getElementById('card-page').textContent = `Page ${currentEntry.page}`;
  document.getElementById('resultBanner').style.display = 'none';
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('userAnswer').value = '';

  const qText = type === 'term_to_def' ? currentEntry.term : currentEntry.meaning;
  document.getElementById('questionSub').textContent = type === 'term_to_def' ? 'Select or provide the Meaning for:' : 'Identify the Term for:';
  document.getElementById('questionText').textContent = qText;

  if (mode === 'mc') {
    document.getElementById('mcContainer').style.display = 'flex';
    document.getElementById('inputContainer').style.display = 'none';
    renderMC(type);
  } else {
    document.getElementById('mcContainer').style.display = 'none';
    document.getElementById('inputContainer').style.display = 'flex';
  }
}

function renderMC(type) {
  const container = document.getElementById('mcContainer');
  container.innerHTML = '';

  const key = type === 'term_to_def' ? 'meaning' : 'term';
  const options = [currentEntry, ...getDistractors(currentEntry, key, 3)];
  options.sort(() => Math.random() - 0.5);

  options.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'mc-option';
    btn.textContent = item[key];
    btn.onclick = () => {
      const allBtns = container.querySelectorAll('.mc-option');
      allBtns.forEach(b => b.disabled = true);
      const banner = document.getElementById('resultBanner');
      banner.style.display = 'block';

      if (item.number === currentEntry.number) {
        btn.classList.add('correct');
        banner.className = 'result-banner true-banner';
        banner.innerHTML = `&check; TRUE (CORRECT)`;
      } else {
        btn.classList.add('incorrect');
        banner.className = 'result-banner false-banner';
        banner.innerHTML = `&cross; FALSE (INCORRECT)<br><br><strong>Correct Answer:</strong><br>${currentEntry[key]}`;
        allBtns.forEach(b => {
          if (b.textContent === currentEntry[key]) b.classList.add('correct');
        });
      }
      document.getElementById('btnNext').style.display = 'block';
    };
    container.appendChild(btn);
  });
}

document.getElementById('btnSubmit').onclick = () => {
  const userInput = document.getElementById('userAnswer').value.trim();
  const type = document.getElementById('typeSelect').value;
  const targetText = type === 'term_to_def' ? currentEntry.meaning : currentEntry.term;

  const targetKeywords = extractKeywords(targetText);
  const userKeywords = extractKeywords(userInput);

  let isTrue = false;
  let matchInfo = '';

  if (type === 'def_to_term') {
    const cleanUser = userInput.toLowerCase().replace(/[^a-z0-9]/g, '');
    const cleanTarget = targetText.toLowerCase().replace(/[^a-z0-9]/g, '');
    isTrue = cleanUser === cleanTarget || (cleanTarget.length > 3 && cleanUser.includes(cleanTarget));
  } else {
    const matched = targetKeywords.filter(k => userKeywords.includes(k));
    const ratio = targetKeywords.length > 0 ? (matched.length / targetKeywords.length) : 0;
    // Considered TRUE if >= 40% of substantive target keywords are present
    isTrue = ratio >= 0.40;
    matchInfo = `Keyword Match: ${matched.length}/${targetKeywords.length} (${Math.round(ratio*100)}%)<br>Found: [${matched.join(', ') || 'None'}]`;
  }

  const banner = document.getElementById('resultBanner');
  banner.style.display = 'block';
  if (isTrue) {
    banner.className = 'result-banner true-banner';
    banner.innerHTML = `&check; TRUE (CORRECT)<br>${matchInfo ? `<small>${matchInfo}</small><br>` : ''}<strong>Full Reference:</strong><br>${targetText}`;
  } else {
    banner.className = 'result-banner false-banner';
    banner.innerHTML = `&cross; FALSE (INCORRECT)<br>${matchInfo ? `<small>${matchInfo}</small><br>` : ''}<strong>Expected Answer:</strong><br>${targetText}`;
  }
  document.getElementById('btnNext').style.display = 'block';
};

document.getElementById('modeSelect').onchange = loadQuestion;
document.getElementById('typeSelect').onchange = loadQuestion;
document.getElementById('btnNext').onclick = loadQuestion;

// Initial start
loadQuestion();
</script>
